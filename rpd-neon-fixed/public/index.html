<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Rizwan Paratha Experts — Live Screen</title>
<style>
  :root{
    --gold: #F7B500; --gold-deep: #D89A00; --gold-pale: #FFE9AE;
    --maroon: #9C1B1B; --maroon-deep: #6E1212;
    --brown: #402512; --brown-deep: #241205;
    --cream: #FFF4DC; --ink: #FFF4DC; --ink-dim: #d8c6a3;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, rgba(247,181,0,0.16) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(156,27,27,0.18) 0%, transparent 60%),
      linear-gradient(180deg, var(--brown-deep) 0%, #150b03 100%);
    font-family: var(--mono); color: var(--ink); }

  #layout{ position:relative; height:100%; width:100%; display:flex; flex-direction:column; }

  #brandHeader{ flex:0 0 auto; text-align:center; padding:14px 10px 8px; }
  #brandHeader h1{ font-family: var(--serif); font-weight:700; font-style:italic; font-size:28px; margin:0;
    color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 24px rgba(247,181,0,0.25); }
  #brandHeader h1 span{ color: var(--maroon); -webkit-text-stroke: 0.6px var(--gold-pale); }
  #brandHeader p{ margin:4px 0 0 0; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color: var(--ink-dim); }

  #body{ flex:1 1 auto; display:flex; gap:16px; padding: 8px 16px 16px; min-height:0; }

  #mediaArea{ position:relative; flex: 2 1 0; border-radius:18px; overflow:hidden;
    background:#150c05; border:3px solid var(--cream); box-shadow: 0 20px 55px rgba(0,0,0,0.55); }

  .mediaLayer{ position:absolute; inset:0; width:100%; height:100%; opacity:0;
    transition: opacity 0.7s ease; display:flex; align-items:center; justify-content:center; text-align:center; }
  .mediaLayer.active{ opacity:1; }
  .mediaLayer img{ width:100%; height:100%; object-fit:cover; }
  .mediaLayer .caption{ position:absolute; left:0; right:0; bottom:0; padding: 30px 24px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 10%, transparent 100%); text-align:left; }
  .mediaLayer .caption .tag{ font-family: var(--serif); font-style:italic; font-weight:700;
    font-size: clamp(20px,3.4vw,34px); color: var(--gold); text-shadow:0 3px 12px rgba(0,0,0,0.6); }
  .mediaLayer .caption .sub{ font-size:13px; color: var(--ink-dim); margin-top:4px; }

  #welcomeSlide{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background: radial-gradient(ellipse at 50% 45%, rgba(247,181,0,0.18) 0%, transparent 65%), #150c05; }
  #welcomeSlide .big{ font-family: var(--serif); font-style:italic; font-weight:700; color: var(--gold);
    font-size: clamp(28px,5vw,52px); text-shadow: 0 3px 14px rgba(0,0,0,0.7); }
  #welcomeSlide .small{ color: var(--ink-dim); font-size:14px; }

  #sidePanel{ flex: 1 1 0; min-width:220px; max-width:320px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; border-radius:18px; padding:20px;
    background: rgba(36,18,5,0.55); border:1px solid rgba(255,233,174,0.18); backdrop-filter: blur(6px); }
  #sidePanel h2{ font-family: var(--serif); font-style:italic; font-size:18px; margin:0; color: var(--gold); text-align:center; }
  #qrWrap{ background:#fff; padding:12px; border-radius:14px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
  #qrWrap img{ display:block; width:180px; height:180px; }
  #sidePanel .hint{ font-size:11px; color: var(--ink-dim); text-align:center; letter-spacing:0.04em; }

  #statusPill{ position:absolute; top:16px; left:16px; z-index:20; display:flex; align-items:center; gap:6px;
    border:1px solid rgba(255,233,174,0.18); background: rgba(36,18,5,0.6); backdrop-filter: blur(6px);
    padding:5px 10px; border-radius:14px; font-size:9.5px; letter-spacing:0.03em; }
  #statusPill .dot{ width:6px; height:6px; border-radius:50%; background:#8d7a5c; }
  #statusPill.live .dot{ background: #7ed957; box-shadow:0 0 8px #7ed957; }

  @media (max-width: 820px){
    #body{ flex-direction:column; }
    #sidePanel{ max-width:none; flex-direction:row; }
    #qrWrap img{ width:120px; height:120px; }
  }
</style>
</head>
<body>
<div id="layout">
  <div id="statusPill"><span class="dot"></span><span id="statusText">connecting…</span></div>
  <div id="brandHeader">
    <h1>Al-Rizwan <span>Paratha</span> Experts</h1>
    <p>Live Menu &amp; Offers Screen</p>
  </div>
  <div id="body">
    <div id="mediaArea">
      <div id="welcomeSlide" class="mediaLayer active">
        <div class="big">Welcome Back To Your Favourite Kitchen!</div>
        <div class="small">Fresh parathas, made to order 🔥</div>
      </div>
    </div>
    <div id="sidePanel">
      <h2>Scan for our full menu</h2>
      <div id="qrWrap"><img id="qrImg" src="" alt="QR code to menu"></div>
      <div class="hint">Point your camera here to order or browse the menu</div>
    </div>
  </div>
</div>

<script>
const mediaArea = document.getElementById('mediaArea');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const qrImg = document.getElementById('qrImg');

let slides = [];
let slideIndex = 0;
let currentMenuUrl = null;
const ROTATE_MS = 7000;
const POLL_MS = 60000;

function setQr(url){
  if(!url || url === currentMenuUrl) return;
  currentMenuUrl = url;
  const encoded = encodeURIComponent(url);
  qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=${encoded}`;
}

function renderWelcome(){
  mediaArea.innerHTML = `
    <div id="welcomeSlide" class="mediaLayer active">
      <div class="big">Welcome Back To Your Favourite Kitchen!</div>
      <div class="small">Fresh parathas, made to order 🔥</div>
    </div>`;
}

function renderSlide(slide){
  mediaArea.innerHTML = `
    <div class="mediaLayer active">
      <img src="${slide.image}" alt="${slide.tag || 'Promo'}">
      <div class="caption">
        <div class="tag">${slide.tag || 'Special Offer!'}</div>
        ${slide.sub ? `<div class="sub">${slide.sub}</div>` : ''}
      </div>
    </div>`;
}

function tick(){
  if(!slides.length){
    renderWelcome();
    return;
  }
  renderSlide(slides[slideIndex % slides.length]);
  slideIndex++;
}

async function fetchSlides(){
  try{
    const res = await fetch('/api/slides');
    slides = await res.json();
    statusPill.classList.add('live');
    statusText.textContent = slides.length ? `${slides.length} promo${slides.length>1?'s':''} live` : 'menu screen';
  } catch(e){
    statusPill.classList.remove('live');
    statusText.textContent = 'offline — retrying';
  }
}

async function fetchConfig(){
  try{
    const res = await fetch('/api/config');
    const cfg = await res.json();
    setQr(cfg.menuUrl);
  } catch(e){ /* keep last known QR */ }
}

async function init(){
  await Promise.all([fetchSlides(), fetchConfig()]);
  tick();
  setInterval(tick, ROTATE_MS);
  setInterval(fetchSlides, POLL_MS);
  setInterval(fetchConfig, POLL_MS);
}

init();
</script>
</body>
</html>
