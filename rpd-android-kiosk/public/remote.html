<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<title>Spin the Wheel — Al-Rizwan Paratha Experts</title>
<style>
  :root{
    --gold:#F7B500; --gold-deep:#D89A00; --maroon:#9C1B1B; --brown-deep:#241205;
    --cream:#FFF4DC; --ink-dim:#d8c6a3; --serif: Georgia, 'Times New Roman', serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{ font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, rgba(247,181,0,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(156,27,27,0.2) 0%, transparent 60%),
      linear-gradient(180deg, var(--brown-deep) 0%, #150b03 100%);
    color: var(--cream); min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; text-align:center; }

  img.logo{ width:110px; height:110px; border-radius:50%; box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 0 5px rgba(247,181,0,0.2);
    animation: float 3.4s ease-in-out infinite; margin-bottom:14px; }
  @keyframes float{ 0%,100%{ transform: translateY(0) rotate(-1.5deg);} 50%{ transform: translateY(-8px) rotate(1.5deg);} }

  h1{ font-family: var(--serif); font-style:italic; color: var(--gold); font-size:22px; margin:0 0 4px; }
  p.sub{ color: var(--ink-dim); font-size:13px; margin:0 0 28px; letter-spacing:0.03em; }

  #stage{ width:100%; max-width:360px; }
  .msg{ font-family: var(--serif); font-style:italic; color: var(--gold); font-size:19px; margin-bottom:20px; min-height:26px; }

  button.action{ width:100%; padding:22px 16px; font-size:19px; font-weight:700; border:none; border-radius:18px;
    cursor:pointer; margin-bottom:14px; box-shadow: 0 10px 26px rgba(0,0,0,0.35); transition: transform 0.15s ease; }
  button.action:active{ transform: scale(0.96); }
  button.action:disabled{ opacity:0.45; cursor:default; }
  .btn-victory{ background: linear-gradient(180deg,#F7B500,#D89A00); color:#241205; }
  .btn-stop{ background: linear-gradient(180deg,#9C1B1B,#6E1212); color:#FFF4DC; }
  .btn-keep{ background: linear-gradient(180deg,#2a7a2a,#1e5c1e); color:#FFF4DC; }
  .btn-again{ background: linear-gradient(180deg,#5a4a2a,#3a301a); color:#FFF4DC; }

  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background: rgba(36,18,5,0.9); border:1px solid rgba(255,233,174,0.25); padding:10px 18px; border-radius:999px;
    font-size:13px; color: var(--gold); transition: all 0.3s ease; pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <img class="logo" src="/logo.jpg" alt="Al-Rizwan Paratha Experts">
  <h1>Al-Rizwan Paratha Experts</h1>
  <p class="sub">Spin the wheel right from your table 🫓</p>

  <div id="stage">
    <div class="msg" id="msg">Checking the big screen…</div>
    <div id="buttons"></div>
  </div>

  <div id="toast"></div>

<script>
const msgEl = document.getElementById('msg');
const buttonsEl = document.getElementById('buttons');
const toastEl = document.getElementById('toast');

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

async function sendAction(action, label){
  try{
    await fetch('/api/wheel/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    showToast(label + ' — sent to the screen!');
  } catch(e){
    showToast('Could not reach the screen, try again');
  }
}

function render(state){
  if (state === 'idle') {
    msgEl.textContent = 'Ready when you are!';
    buttonsEl.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'action btn-victory';
    btn.textContent = '✌️ Spin the Wheel';
    btn.onclick = () => { btn.disabled = true; sendAction('victory', 'Spin').then(() => setTimeout(() => btn.disabled = false, 1500)); };
    buttonsEl.appendChild(btn);
  } else if (state === 'spinning') {
    msgEl.textContent = '🌀 Spinning on the big screen…';
    buttonsEl.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'action btn-stop';
    btn.textContent = '🖐️ Stop the Wheel';
    btn.onclick = () => { btn.disabled = true; sendAction('open_palm', 'Stop').then(() => setTimeout(() => btn.disabled = false, 1500)); };
    buttonsEl.appendChild(btn);
  } else if (state === 'stopping') {
    msgEl.textContent = '🎯 Landing on a prize…';
    buttonsEl.innerHTML = '';
  } else if (state === 'stopped') {
    msgEl.textContent = '🎉 Look at the screen — is that a winner?';
    buttonsEl.innerHTML = '';
    const keepBtn = document.createElement('button');
    keepBtn.className = 'action btn-keep';
    keepBtn.textContent = '👍 Keep It!';
    keepBtn.onclick = () => { keepBtn.disabled = true; sendAction('thumbs_up', 'Keep it'); };
    const againBtn = document.createElement('button');
    againBtn.className = 'action btn-again';
    againBtn.textContent = '👎 Spin Again';
    againBtn.onclick = () => { againBtn.disabled = true; sendAction('thumbs_down', 'Spin again'); };
    buttonsEl.appendChild(keepBtn);
    buttonsEl.appendChild(againBtn);
  } else if (state === 'celebrating') {
    msgEl.textContent = '🎉 Enjoy your prize! Watch the screen.';
    buttonsEl.innerHTML = '';
  } else {
    msgEl.textContent = 'Connecting to the screen…';
    buttonsEl.innerHTML = '';
  }
}

let lastState = null;
async function poll(){
  try{
    const res = await fetch('/api/wheel/state');
    const data = await res.json();
    const state = (data && data.state) || 'idle';
    if (state !== lastState) render(state);
    lastState = state;
  } catch(e){
    msgEl.textContent = 'Could not reach the screen — check your connection';
  }
}

poll();
setInterval(poll, 1200);
</script>
</body>
</html>
